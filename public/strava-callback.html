<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Strava · Cycle Indoors</title>
    <style>
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.4 system-ui, sans-serif; background: #0d1117; color: #c9d1d9;
      }
    </style>
  </head>
  <body>
    <p id="message">Connecting to Cycle Indoors…</p>
    <script>
      // Strava redirects the pop-up here after the rider decides. Hand the
      // query back to the app tab, which checks `state` and exchanges the code.
      // The channel name must match CALLBACK_CHANNEL in src/activity/strava.ts.
      const query = new URLSearchParams(location.search);
      const result = {
        state: query.get('state'),
        code: query.get('code'),
        scope: query.get('scope'),
        error: query.get('error'),
      };
      try {
        const channel = new BroadcastChannel('cycle-indoors.strava-auth');
        channel.postMessage(result);
        channel.close();
      } catch {}
      document.getElementById('message').textContent = result.error
        ? 'Strava access was not granted. You can close this window.'
        : 'Done. You can close this window.';
      setTimeout(() => window.close(), 300);
    </script>
  </body>
</html>
